<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inotrope Dosing Calendar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        input[type="number"], input[type="datetime-local"] { padding: 0.5rem; width: 200px; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background-color: #f4f4f4; }
        #output { margin-top: 1.5rem; }
        #serial { white-space: pre-wrap; background: #f9f9f9; padding: 1rem; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Inotrope Dosing Calendar Generator</h1>
    <div class="input-group">
        <label for="dose">Starting Dose (mcg/kg/min or mg/hr):</label>
        <input type="number" id="dose" step="0.1" placeholder="e.g., 5.5">
    </div>
    <div class="input-group">
        <label for="start">Start Date &amp; Time (15‑minute steps):</label>
        <input type="datetime-local" id="start" step="900"> <!-- 900 seconds = 15 minutes -->
    </div>
    <div class="input-group">
        <label for="interval">Dosing Interval (hours):</label>
        <input type="number" id="interval" step="0.1" placeholder="e.g., 6">
    </div>
    <div class="input-group">
        <label for="count">Number of Doses:</label>
        <input type="number" id="count" value="24" min="1">
    </div>
    <div class="input-group">
        <button id="generate">Generate Calendar</button>
    </div>
    <div id="output">
        <h2>Dosing Calendar</h2>
        <table id="calendar">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Time (HH:MM)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <h2>Serial List</h2>
        <div id="serial"></div>
    </div>

    <script>
        document.getElementById('generate').addEventListener('click', function () {
            const dose = parseFloat(document.getElementById('dose').value);
            const startStr = document.getElementById('start').value;
            const intervalHours = parseFloat(document.getElementById('interval').value);
            const count = parseInt(document.getElementById('count').value, 10);

            if (isNaN(dose) || !startStr || isNaN(intervalHours) || isNaN(count) || count <= 0) {
                alert('Please fill in all fields with valid numbers.');
                return;
            }

            const start = new Date(startStr); // datetime-local returns local time
            if (isNaN(start)) {
                alert('Invalid date/time.');
                return;
            }

            const tbody = document.querySelector('#calendar tbody');
            tbody.innerHTML = '';
            const serialLines = [];

            let current = new Date(start); // copy
            for (let i = 0; i < count; i++) {
                const datePart = current.toLocaleDateString(undefined, { year: 'numeric', month: '2-digit', day: '2-digit' });
                const timePart = current.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
                const row = document.createElement('tr');
                row.innerHTML = `<td>${i + 1}</td><td>${datePart}</td><td>${timePart}</td>`;
                tbody.appendChild(row);
                serialLines.push(`${datePart} ${timePart}`);

                // add interval hours
                current = new Date(current.getTime() + intervalHours * 3600 * 1000);
            }

            document.getElementById('serial').textContent = serialLines.join('\n');
        });
    </script>
</body>
</html>
