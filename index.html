<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dosing Calendar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], input[type="time"] { padding: 0.5rem; width: 260px; }
        .radio-group { margin: 0.5rem 0; }
        button { padding: 0.5rem 1rem; cursor: pointer; margin-right: 0.5rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background-color: #f4f4f4; }
        #output { margin-top: 1.5rem; }
        #serial { white-space: pre-wrap; background: #f9f9f9; padding: 1rem; border: 1px solid #ddd; }
        .patient-info { background: #e9e9e9; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .hidden { display: none; }
        .month-section { page-break-inside: avoid; }
                .calendar-table td { width: 50px; height: 40px; text-align: center; vertical-align: middle; }
                .day-time { text-align: center; }
                .day-number { font-weight: bold; }
                .dose-times { font-size: 0.9em; }
            </style>
</head>
<body>
    <h1>Dosing Calendar Generator</h1>

    <div class="patient-info">
        <strong>Patient Information (for print/reference only):</strong>
        <div>
            <label>Name: <input type="text" id="patientName" placeholder="Patient Name"></label>
        </div>
        <div>
            <label>Birthday: <input type="date" id="patientBirthday"></label>
        </div>
        <div>
            <label>MRN: <input type="text" id="patientMRN" placeholder="Medical Record Number"></label>
        </div>
    </div>

    <div class="input-group">
        <label for="drugInfo">Drug:</label>
        <input type="text" id="drugInfo" placeholder="Drug and dose">
    </div>

    <div class="input-group">
        <label for="intervalHours">Dosing Interval (hours):</label>
        <input type="number" id="intervalHours" step="0.1" placeholder="e.g., 8">
    </div>

    <div class="input-group">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
    </div>
    <div class="input-group">
        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime" step="1800" value="08:00">
    </div>

    <fieldset>
        <legend>Stop Condition</legend>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="doses" checked> Number of Doses:</label>
            <input type="number" id="stopDoses" min="1" value="5" style="width:80px;">
        </div>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="days"> Number of Days:</label>
            <input type="number" id="stopDays" min="1" value="1" style="width:80px;">
        </div>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="date"> Specified Stop Date (last dose date):</label>
            <input type="date" id="stopDate">
        </div>
    </fieldset>

    <div class="input-group">
        <button id="generate">Generate Calendar</button>
        <button id="printBtn">Print</button>
    </div>

    <div id="output">
<h2>Dosing Calendar</h2>

<div id="patientInfoDisplay"></div>

<div id="monthlyCalendar"></div></div>
    </div>

    <script>
document.getElementById('generate').addEventListener('click', function () {

    console.log('Generate clicked');

    const drugInfo = document.getElementById('drugInfo').value.trim();

    const intervalHours = parseFloat(document.getElementById('intervalHours').value);

    const startDateStr = document.getElementById('startDate').value;

    const startTimeStr = document.getElementById('startTime').value;

    const patientName = document.getElementById('patientName').value.trim();

    const patientBirthday = document.getElementById('patientBirthday').value;

    const patientMRN = document.getElementById('patientMRN').value.trim();


    console.log('Form values:', {drugInfo, intervalHours, startDateStr, startTimeStr, patientName, patientBirthday, patientMRN});


    if (!drugInfo || isNaN(intervalHours) || intervalHours <= 0 ||

        !startDateStr || !startTimeStr) {

        alert('Please fill in Drug, Dosing Interval, Start Date, and Start Time with valid values.');

        return;

    }


    const start = new Date(startDateStr + 'T' + startTimeStr);

    if (isNaN(start)) {

        alert('Invalid start date/time.');

            return;

    }


    // Determine stop condition

    const stopMode = document.querySelector('input[name="stopMode"]:checked').value;

    let totalDoses = 0;

    if (stopMode === 'doses') {

        const dosesInput = document.getElementById('stopDoses');

        totalDoses = parseInt(dosesInput.value, 10);

        if (isNaN(totalDoses) || totalDoses < 1) {

            alert('Please enter a valid number of doses.');

            return;

        }

    } else if (stopMode === 'days') {

        const daysInput = document.getElementById('stopDays');

        const days = parseInt(daysInput.value, 10);

        if (isNaN(days) || days < 1) {

            alert('Please enter a valid number of days.');

            return;

        }

        const totalHours = days * 24;

        totalDoses = Math.floor(totalHours / intervalHours) + 1;

    } else { // date

        const stopDateStr = document.getElementById('stopDate').value;

        if (!stopDateStr) {

            alert('Please select a stop date.');

            return;

        }

        const stopDate = new Date(stopDateStr + 'T23:59:59'); // end of day

        if (isNaN(stopDate)) {

            alert('Invalid stop date.');

            return;

        }

        if (stopDate < start) {

            alert('Stop date must be on or after start date.');

            return;

        }

        const diffMs = stopDate - start;

        const diffHours = diffMs / (1000 * 60 * 60);

        totalDoses = Math.floor(diffHours / intervalHours) + 1;

    }


    console.log('Total doses:', totalDoses);


    // Generate dose dates and times

    const doses = [];

    let current = new Date(start);

    for (let i = 0; i < totalDoses; i++) {

        const dateStr = `${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`;
        const timeStr = current.toTimeString().slice(0,5); // HH:MM

        doses.push({date: new Date(current), dateStr, timeStr});

        // add interval hours

        current = new Date(current.getTime() + intervalHours * 3600 * 1000);

    }


    // Build map dateStr -> array of timeStr

    const doseMap = {};

    doses.forEach(d => {

        if (!doseMap[d.dateStr]) doseMap[d.dateStr] = [];

        doseMap[d.dateStr].push(d.timeStr);

    });


    // Determine month range

    const firstDate = new Date(doses[0].date);

    const lastDate = new Date(doses[doses.length-1].date);

    const startYear = firstDate.getFullYear();

    const startMonth = firstDate.getMonth(); // 0-11

    const endYear = lastDate.getFullYear();

    const endMonth = lastDate.getMonth();


    // Generate list of months to display

    const months = [];

    let y = startYear, m = startMonth;

    while (y < endYear || (y === endYear && m <= endMonth)) {

        months.push({year: y, month: m});

        if (m === 11) { m = 0; y++; } else { m++; }

    }


    // Display patient info

    const patientInfoDisplay = document.getElementById('patientInfoDisplay');

    let patientInfoHTML = '';

    if (patientName || patientBirthday || patientMRN) {

        patientInfoHTML = '<strong>Patient:</strong> ';

        if (patientName) patientInfoHTML += patientName + ' ';

        if (patientBirthday) patientInfoHTML += 'DOB: ' + patientBirthday + ' ';

        if (patientMRN) patientInfoHTML += 'MRN: ' + patientMRN;

        patientInfoHTML += '<br>';

    }

    patientInfoDisplay.innerHTML = patientInfoHTML;


    // Generate calendars for each month

    const monthlyCalendarDiv = document.getElementById('monthlyCalendar');

    let calendarHTML = '';
    const headerHTML = `<div style="margin-bottom:0.5rem;font-size:0.9rem;"><strong>Patient:</strong> ${patientName || ''} ${patientBirthday ? 'DOB: ' + patientBirthday : ''} ${patientMRN ? 'MRN: ' + patientMRN : ''} | <strong>Drug:</strong> ${drugInfo} | <strong>Interval:</strong> ${intervalHours} hours</div>`;

    months.forEach((mObj, idx) => {

        calendarHTML += "<div class=\"month-section\">";
        calendarHTML += headerHTML;
        const year = mObj.year;

        const month = mObj.month; // 0-11

        const monthName = new Date(year, month, 1).toLocaleDateString(undefined, {month: 'long'});

        calendarHTML += `<h3>${monthName} ${year}</h3>`;

        calendarHTML += '<table class="calendar-table"><thead><tr>';

        const weekDays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        weekDays.forEach(day => calendarHTML += `<th class="weekday">${day}</th>`);

        calendarHTML += '</tr></thead><tbody>';


        // First day of month

        const firstDay = new Date(year, month, 1);

        // Days in month

        const daysInMonth = new Date(year, month+1, 0).getDate();

        // Day of week of first day (0=Sun, ..., 6=Sat)

        const startOffset = firstDay.getDay(); // 0-6


        let day = 1;

        for (let week = 0; week < 6; week++) { // up to 6 weeks

            calendarHTML += '<tr>';

            for (let col = 0; col < 7; col++) {

                if (week === 0 && col < startOffset) {

                    calendarHTML += '<td></td>';

                } else if (day > daysInMonth) {

                    calendarHTML += '<td></td>';

                } else {

                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

                    const isToday = (day === new Date().getDate() &&

                                        month === new Date().getMonth() &&

                                        year === new Date().getFullYear());

                    const hasDose = doseMap[dateStr] && doseMap[dateStr].length > 0;

                    let classes = '';

                    if (isToday) classes += ' today';

                    if (hasDose) classes += ' has-dose';

                    calendarHTML += `<td class="${classes.trim()}">`;
                    
                                        calendarHTML += `<div class="day-time">`;
                                        calendarHTML += `<div class="day-number">${day}</div>`;
                                        if (hasDose) {
                                            const times = doseMap[dateStr].join(', ');
                                            calendarHTML += `<div class="dose-times">${times}</div>`;
                                        }
                    
                                        calendarHTML += `</div>`;
                    
                                        calendarHTML += `</td>`;

                    day++;

                }

            }

            calendarHTML += '</tr>';

            if (day > daysInMonth) break;

        }

        calendarHTML += '</tbody></table>';

        if (idx < months.length-1) calendarHTML += '<hr>';
        calendarHTML += '</div>';

    });


    monthlyCalendarDiv.innerHTML = calendarHTML;

// Auto-select stop condition radio button when user types in corresponding inputs
document.getElementById('stopDoses').addEventListener('input', function () {
    document.querySelector('input[name=\"stopMode\"][value=\"doses\"]').checked = true;
});
document.getElementById('stopDays').addEventListener('input', function () {
    document.querySelector('input[name=\"stopMode\"][value=\"days\"]').checked = true;
});
document.getElementById('stopDate').addEventListener('input', function () {
    document.querySelector('input[name=\"stopMode\"][value=\"date\"]').checked = true;
});
document.getElementById('printBtn').addEventListener('click', function () {
    window.print();
});
});</script>
</body>
</html>
