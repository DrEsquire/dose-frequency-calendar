<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dosing Calendar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], input[type="time"] { padding: 0.5rem; width: 260px; }
        .radio-group { margin: 0.5rem 0; }
        button { padding: 0.5rem 1rem; cursor: pointer; margin-right: 0.5rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background-color: #f4f4f4; }
        #output { margin-top: 1.5rem; }
        #serial { white-space: pre-wrap; background: #f9f9f9; padding: 1rem; border: 1px solid #ddd; }
        .patient-info { background: #e9e9e9; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Dosing Calendar Generator</h1>

    <div class="patient-info">
        <strong>Patient Information (for print/reference only):</strong>
        <div>
            <label>Name: <input type="text" id="patientName" placeholder="Patient Name"></label>
        </div>
        <div>
            <label>Birthday: <input type="date" id="patientBirthday"></label>
        </div>
        <div>
            <label>MRN: <input type="text" id="patientMRN" placeholder="Medical Record Number"></label>
        </div>
    </div>

    <div class="input-group">
        <label for="drugInfo">Drug / Dose (e.g., Vancomycin 15 mg/kg):</label>
        <input type="text" id="drugInfo" placeholder="Drug and dose">
    </div>

    <div class="input-group">
        <label for="intervalHours">Dosing Interval (hours):</label>
        <input type="number" id="intervalHours" step="0.1" placeholder="e.g., 8">
    </div>

    <div class="input-group">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
    </div>
    <div class="input-group">
        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime">
    </div>

    <fieldset>
        <legend>Stop Condition</legend>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="doses" checked> Number of Doses:</label>
            <input type="number" id="stopDoses" min="1" value="5" style="width:80px;">
        </div>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="days"> Number of Days:</label>
            <input type="number" id="stopDays" min="1" value="1" style="width:80px;">
        </div>
        <div class="radio-group">
            <label><input type="radio" name="stopMode" value="date"> Specified Stop Date (last dose date):</label>
            <input type="date" id="stopDate">
        </div>
    </fieldset>

    <div class="input-group">
        <button id="generate">Generate Calendar</button>
        <button id="printBtn">Print</button>
    </div>

    <div id="output">
        <h2>Dosing Calendar</h2>
        <table id="calendar">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Drug / Dose</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <h2>Serial List (Date Time)</h2>
        <div id="serial"></div>
    </div>

    <script>
        document.getElementById('generate').addEventListener('click', function () {
            const drugInfo = document.getElementById('drugInfo').value.trim();
            const intervalHours = parseFloat(document.getElementById('intervalHours').value);
            const startDateStr = document.getElementById('startDate').value;
            const startTimeStr = document.getElementById('startTime').value;
            const patientName = document.getElementById('patientName').value.trim();
            const patientBirthday = document.getElementById('patientBirthday').value;
            const patientMRN = document.getElementById('patientMRN').value.trim();

            if (!drugInfo || isNaN(intervalHours) || intervalHours <= 0 ||
                !startDateStr || !startTimeStr ||
                !patientName || !patientBirthday || !patientMRN) {
                alert('Please fill in all fields with valid values.');
                return;
            }

            const start = new Date(startDateStr + 'T' + startTimeStr);
            if (isNaN(start)) {
                alert('Invalid start date/time.');
                return;
            }

            // Determine stop condition
            const stopMode = document.querySelector('input[name="stopMode"]:checked').value;
            let totalDoses = 0;
            if (stopMode === 'doses') {
                const dosesInput = document.getElementById('stopDoses');
                totalDoses = parseInt(dosesInput.value, 10);
                if (isNaN(totalDoses) || totalDoses < 1) {
                    alert('Please enter a valid number of doses.');
                    return;
                }
            } else if (stopMode === 'days') {
                const daysInput = document.getElementById('stopDays');
                const days = parseInt(daysInput.value, 10);
                if (isNaN(days) || days < 1) {
                    alert('Please enter a valid number of days.');
                    return;
                }
                const totalHours = days * 24;
                totalDoses = Math.floor(totalHours / intervalHours) + 1;
            } else { // date
                const stopDateStr = document.getElementById('stopDate').value;
                if (!stopDateStr) {
                    alert('Please select a stop date.');
                    return;
                }
                const stopDate = new Date(stopDateStr + 'T23:59:59'); // end of day
                if (isNaN(stopDate)) {
                    alert('Invalid stop date.');
                    return;
                }
                if (stopDate < start) {
                    alert('Stop date must be on or after start date.');
                    return;
                }
                const diffMs = stopDate - start;
                const diffHours = diffMs / (1000 * 60 * 60);
                totalDoses = Math.floor(diffHours / intervalHours) + 1;
            }

            const tbody = document.querySelector('#calendar tbody');
            tbody.innerHTML = '';
            const serialLines = [];

            let current = new Date(start);
            for (let i = 0; i < totalDoses; i++) {
                const datePart = current.toLocaleDateString(undefined, { year: 'numeric', month: '2-digit', day: '2-digit' });
                const hours = String(current.getHours()).padStart(2, '0');
                const minutes = String(current.getMinutes()).padStart(2, '0');
                const timePart = `${hours}:${minutes}`;
                const row = document.createElement('tr');
                row.innerHTML = `<td>${i + 1}</td><td>${datePart}</td><td>${timePart}</td><td>${drugInfo}</td>`;
                tbody.appendChild(row);
                serialLines.push(`${datePart} ${timePart}`);

                // add interval hours
                current = new Date(current.getTime() + intervalHours * 3600 * 1000);
            }

            document.getElementById('serial').textContent = serialLines.join('
');
        });

        document.getElementById('printBtn').addEventListener('click', function () {
            window.print();
        });

        // Ensure only one stop mode input is enabled at a time
        const radios = document.querySelectorAll('input[name="stopMode"]');
        radios.forEach(radio => {
            radio.addEventListener('change', function () {
                document.getElementById('stopDoses').disabled = true;
                document.getElementById('stopDays').disabled = true;
                document.getElementById('stopDate').disabled = true;
                if (this.value === 'doses') document.getElementById('stopDoses').disabled = false;
                if (this.value === 'days') document.getElementById('stopDays').disabled = false;
                if (this.value === 'date') document.getElementById('stopDate').disabled = false;
            });
        });
        // Initialize
        document.getElementById('stopDoses').disabled = false;
        document.getElementById('stopDays').disabled = true;
        document.getElementById('stopDate').disabled = true;
    </script>
</body>
</html>
